apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 * Change this to TRUE so your proguard-rules.pro file is actually executed!
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// 👇 INJECT STRUCTURAL EXCLUSION RULES TO KILL THE DUPLICATE MODULE
configurations.all {
    resolutionStrategy {
        exclude group: 'io.github.zhongwuzw', module: 'mmkv'
        exclude group: 'io.github.zhongwuzw', module: 'annotation'
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.hrms_"
    defaultConfig {
        applicationId "com.hrms_"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        
        // Bump version code to 41 to force a fresh Play Console tracking identity
        versionCode 41 
        versionName "2.008"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_ALIGN_PAGE_SIZE=ON"
            }
            ndkBuild {
                arguments "APP_ALIGN_PAGE_SIZE=true"
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
             release {
            // if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
            //     storeFile file(MYAPP_UPLOAD_STORE_FILE)
            //     storePassword MYAPP_UPLOAD_STORE_PASSWORD
            //     keyAlias MYAPP_UPLOAD_KEY_ALIAS
            //     keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            // }
            storeFile file('my-upload-key.keystore')
        storePassword 'Manas@krishna'
        keyAlias 'my-key-alias'
        keyPassword 'Manas@krishna'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds // Now securely runs with TRUE!
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

subprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            freeCompilerArgs += ["-Xskip-prerelease-check", "-Xallow-unstable-dependencies"]
            suppressWarnings = true
        }
    }
}

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
apply plugin: 'com.google.gms.google-services'